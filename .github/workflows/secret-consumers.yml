# orot-ai 전 저장소 공통: 시크릿·공통 환경 경로를 바꾼 PR은 그 값을 쓰는 작업을 실제로 돌린 결과가 본문에 있어야 통과한다.
# 본문 줄 꼴: `소비 확인: <파일 이름> — <돌린 작업> exit=0` 또는 `… HTTP 200` (값은 적지 않는다).
# 정본은 orot-ai/.github/workflow-templates. 설치·갱신은 orot-ai/bayon 900_system/integrations/gh-issue/issue.py workflow --all.
name: 시크릿 소비 확인
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
  pull-requests: read
jobs:
  secret-consumers:
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 바뀐 시크릿·환경 경로와 본문의 소비 확인 대조
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files" > files.json
          python3 - <<'PY'
          import json, os, re, sys
          # 바뀐 줄·파일 이름에서 찾는 것: 시크릿 폴더 경로의 파일 이름, .env 계열, 셸 공통 환경, 토큰 로더
          PATH_REF = re.compile(r"(?:900_system|\.claude)/secrets(?:/([A-Za-z0-9_.@-]+))?")
          ENV_FILE = re.compile(r"(?<![A-Za-z0-9_])(\.env(?:\.[A-Za-z0-9_-]+)?|[A-Za-z0-9_-]+\.dotenv)(?![A-Za-z0-9_])")
          SHELL_ENV = re.compile(r"(?<![A-Za-z0-9_])(\.zshrc|\.zprofile|\.bash_profile|load-[a-z0-9-]+-token\.sh)(?![A-Za-z0-9_])")
          RESULT = re.compile(r"exit=\d+|HTTP \d{3}")
          raw = open("files.json").read()
          # --paginate는 페이지 배열을 이어 붙인다
          decoder, idx, rows = json.JSONDecoder(), 0, []
          while idx < len(raw):
              while idx < len(raw) and raw[idx].isspace():
                  idx += 1
              if idx >= len(raw):
                  break
              part, idx = decoder.raw_decode(raw, idx)
              rows.extend(part)
          keys = set()
          def scan(text):
              for m in PATH_REF.finditer(text):
                  keys.add(m.group(1) or "secrets")
              keys.update(m.group(1) for m in ENV_FILE.finditer(text))
              keys.update(m.group(1) for m in SHELL_ENV.finditer(text))
          for row in rows:
              name = row["filename"]
              if name.endswith(".md") or name.startswith(".github/workflows/"):
                  continue  # 문서·워크플로 정의는 값을 쓰지 않는다
              scan(name)
              for line in (row.get("patch") or "").splitlines():
                  if line[:1] in "+-" and not line.startswith(("+++", "---")):
                      scan(line)
          keys = {k for k in keys if not k.endswith((".example", ".sample", ".template"))}  # 값 없는 견본
          if not keys:
              print("시크릿·공통 환경 경로 변경 없음")
              sys.exit(0)
          lines = [l for l in os.environ.get("BODY", "").splitlines() if "소비 확인" in l and RESULT.search(l)]
          missing = sorted(k for k in keys if not any(k in l for l in lines))
          print("바뀐 시크릿·환경 경로: " + ", ".join(sorted(keys)))
          if missing:
              print("::error::이 PR은 시크릿·공통 환경 경로를 바꿉니다. 그 값을 쓰는 작업을 실제로 돌리고 본문에 "
                    "'소비 확인: <이름> — <작업> exit=0'(또는 HTTP 200) 줄을 적어 주세요(값은 적지 않음). 빠진 것: "
                    + ", ".join(missing))
              sys.exit(1)
          print("소비 확인 줄 있음")
          PY
